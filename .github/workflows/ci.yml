# CareGraph CI — invariant checks, real-storage tests, benchmark regression.
#
# The build is gated on scripts/check_invariants.sh. Tests run against
# a real RocksDB instance compiled from source; there is no mocked-storage path
# to fall back to, by design.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Raise this as each phase completes. check_invariants.sh turns a PENDING check into
  # a hard failure once the gating phase reaches the phase that introduces it.
  #
  # At 4: Phase 4's success criteria are met — a real trained GraphSAGE deployed
  # with manifest + checksum, incremental correctness verified against
  # full recompute on 50 randomised mutation sequences, median 6.15x speedup
  # against the 5x target (docs/benchmark_report.md §7). The model-provenance and no-silent-fallback
  # checks are therefore live and enforced from here on.
  #
  # At 5: atomic_commit.rs lands the structural mutation and its embedding
  # update in one WriteBatch, verified by a 100-run fault-injection suite
  # (kill the committing process at a randomised point, 0 non-atomic states
  # observed across 80 actual kills). The GAT incremental path
  # (gat_incremental.rs) is implemented and its own 50-sequence
  # incremental-vs-full-recompute exactness check passes — the same claim
  # Phase 4 makes for GraphSAGE, extended to GAT's non-associative attention
  # aggregation. The atomic-commit check is fully satisfied by the static checks in
  # check_invariants.sh regardless of this value; raising it to 5 here records
  # that both halves of Phase 5's scope are done, not just checked.
  #
  # At 6: the full gRPC API (mutation, traversal, snapshot,
  # similar_care_pathways — proto/caregraph.proto, src/api/) is implemented,
  # real bearer-token auth is enforced, and 5 RPCs are covered by
  # real-server endpoint tests (tests/integration/api_endpoint_test.rs) —
  # The endpoint check passes unconditionally now, the same way the atomic-commit check does. Neo4j and
  # TerminusDB were also brought up live and benchmarks/run_baseline.sh run
  # against both end to end, not just health-checked (docs/benchmark_report.md
  # §8): 2-hop bounded traversal is now a real three-way comparison. That
  # is narrower than Phase 6's original success criteria, which named all
  # five headline metrics across all three systems — point-in-time read
  # latency and incremental-embedding speedup are still CareGraph-only, a
  # disclosed gap, not a silently dropped one (see docs/benchmark_report.md).
  #
  # At 7: all three of Phase 7's pieces are real and verified. Encryption at
  # rest — the rocksdb crate exposes no encryption API at all, so
  # native/rocksdb_encryption/shim.cc bridges directly to RocksDB's real
  # EncryptionProvider/NewEncryptedEnv C++ API with a from-scratch AES-256
  # (verified against two independent FIPS-197 test vectors); proven by an
  # integration test that reads raw on-disk SST bytes after a real flush and
  # confirms a plaintext marker is genuinely absent, with an unencrypted
  # control case proving the search itself is valid. mTLS on the gRPC
  # listener — real TLS handshakes over a real ephemeral TCP port with
  # rcgen-generated certificates: a trusted client cert completes an RPC, no
  # cert and an untrusted-CA cert are both rejected. Live dashboards
  # — GET /metrics (src/metrics_server.rs) finally serves the Prometheus
  # registry dev-stack.yml/prometheus.yml have pointed at since Phase 1;
  # point_in_time_query_seconds/traversal_latency_seconds (src/api/metrics.rs)
  # are new query-path series wired into the real RPC handlers, verified to
  # record real nonzero values from a live gRPC call, not just exist as
  # empty histograms; observability/grafana/dashboards/caregraph_targets.json
  # is a real dashboard bound to the CareGraph-Prometheus datasource.
  #
  # At 8: scripts/run_demo.sh (src/bin/demo_client.rs) is a real, runnable
  # end-to-end demo — verified by actually running it twice against a real
  # built server, including catching and fixing a real teardown bug (Git
  # Bash/MSYS's `$!` is not the real Windows PID `taskkill` needs) between
  # the two runs. A newly-run 100-iteration atomic-commit fault-injection result
  # (benchmarks/results/gate/phase5_fault_injection.log: 37 kills landed,
  # 0 non-atomic states) was captured as a citable artifact in this phase too.
  #
  # At 9: four additions beyond the original scope, gated by the same checks
  # (no new check was added — the "exactly one batch write" check applies
  # unchanged to the new code). Integrated-gradients edge attribution is committed into a new
  # CF_COMMIT_META column family, staged into the same WriteBatch as the
  # structural mutation and the embedding it explains — verified by a real
  # completeness identity on both deployed architectures
  # (tests/embedding/attribution_completeness_test.rs) and, separately, by
  # re-running the atomic-commit fault-injection suite against the new three-way
  # write (benchmarks/results/gate/phase9_fault_injection.log,
  # phase9_fault_injection_gat.log). A discrete self-tuning cap controller
  # (src/embedding/caps.rs) replaces the fixed FANOUT_CAP/MAX_EXPANDED_NODES
  # constants, measuring a real 1.46x p95 reduction
  # (docs/benchmark_report.md §2.7). A SimilarityDelta RPC adds a
  # point-in-time similarity-change query that single-timestamp similarity did not offer.
  # Manifest-driven dispatch (src/embedding/manifest.rs) replaces the
  # hardcoded ModelKind match in atomic_commit.rs, closing a previously-
  # disclosed, unchecked model/manifest mismatch footgun. Two severe
  # findings are disclosed rather than smoothed over: attribution overhead
  # on the real graph is 100-300x larger than an initial small-subgraph
  # estimate (tens of seconds per request — docs/benchmark_report.md §2.6),
  # and one real GAT mutation's completeness residual reached 22.35%, over
  # 3x the correctness suite's own synthetic-fixture tolerance.
  CAREGRAPH_PHASE: "9"

jobs:
  invariants:
    name: Invariant checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce project invariants
        run: bash scripts/check_invariants.sh --phase "$CAREGRAPH_PHASE"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install RocksDB + protobuf build dependencies
        # protobuf-compiler is build.rs's protoc — every Rust build needs it
        # from Phase 6 on, not only jobs that touch src/api/: tonic_build
        # runs unconditionally for the whole crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake llvm-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy (all targets)
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: clippy (baseline load generator)
        run: |
          set -o pipefail
          cargo clippy --bin caregraph-bench-load --features baselines -- -D warnings 2>&1 | tee clippy-baselines.log
      - name: Surface clippy diagnostics
        if: failure()
        run: |
          bash scripts/ci_annotate.sh clippy.log "clippy (all targets)"
          bash scripts/ci_annotate.sh clippy-baselines.log "clippy (baselines)"

  test:
    name: tests against real RocksDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB + protobuf build dependencies
        # protobuf-compiler is build.rs's protoc — every Rust build needs it
        # from Phase 6 on, not only jobs that touch src/api/: tonic_build
        # runs unconditionally for the whole crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake llvm-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2

      - name: In-crate unit tests
        run: cargo test --lib

      - name: Property-based correctness (Phase 2)
        run: cargo test --test unit

      - name: Integration tests (real on-disk RocksDB)
        run: cargo test --test integration

      # Guards against the failure mode where the integration suite silently
      # compiles to zero tests and reports success.
      - name: Assert the integration suite actually ran tests
        run: |
          count=$(cargo test --test integration -- --list 2>/dev/null | grep -c ': test$')
          echo "integration tests discovered: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::integration suite contains no tests"
            exit 1
          fi

  docker:
    name: dev stack builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CareGraph image
        run: |
          set -o pipefail
          docker build --progress=plain \
            -f infrastructure/docker-compose/Dockerfile \
            -t caregraph:ci . 2>&1 | tee docker-build.log
      - name: Surface image-build diagnostics
        if: failure()
        run: bash scripts/ci_annotate.sh docker-build.log "docker build"
      - name: Validate the compose file
        run: docker compose -f infrastructure/docker-compose/dev-stack.yml config -q

  # --- Phase-gated jobs -----------------------------------------------------
  # Enabled as the phases that make them meaningful land. Each is listed here so
  # that the gap is visible in the workflow rather than forgotten.

  embedding:
    name: embedding correctness
    # GraphSAGE (Phase 4) and GAT (Phase 5) incremental-vs-full-recompute
    # exactness — both spawn ml/embedding_server.py, which needs a real
    # Python + torch + torch_geometric interpreter, hence the setup below.
    # Both deployed models are small (~tens of KB) and git-tracked
    # (ml/deployed/**/*.pt is the one *.pt exception in .gitignore) so no
    # training happens in CI — only inference against already-trained,
    # already-committed weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB + protobuf build dependencies
        # protobuf-compiler is build.rs's protoc — every Rust build needs it
        # from Phase 6 on, not only jobs that touch src/api/: tonic_build
        # runs unconditionally for the whole crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake llvm-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch + torch_geometric (CPU wheels)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
      - run: cargo test --test embedding -- --test-threads=1

  fault-injection:
    name: fault injection
    # tests/fault_injection/ now runs two suites, one per `AtomicCommitter`
    # dispatch arm — a GraphSAGE run (`aggregate_over_subgraph`) and a GAT
    # run (`gat_incremental_update`), each 100 kills, 0 non-atomic states
    # locally. `cargo test --test fault_injection` picks up both `#[test]`
    # functions in the binary with no filter change needed here. Needs the
    # same real Python + torch interpreter as the embedding job above — the
    # worker binary this suite spawns and kills makes a real forward pass
    # (GraphSAGE or GAT, per suite) on its way to the commit being
    # interrupted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB + protobuf build dependencies
        # protobuf-compiler is build.rs's protoc — every Rust build needs it
        # from Phase 6 on, not only jobs that touch src/api/: tonic_build
        # runs unconditionally for the whole crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake llvm-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch + torch_geometric (CPU wheels)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
      - run: cargo test --test fault_injection -- --test-threads=1

  # Enabled at Phase 6: run_baseline.sh has now completed against live
  # Neo4j + TerminusDB baselines by hand, on the full diabetes130 trace —
  # see docs/benchmark_report.md §8 for those numbers. This job runs the
  # smoke trace instead: diabetes130_full.jsonl is derived clinical data
  # (hundreds of MB) and deliberately gitignored (see .gitignore), so it
  # does not exist on a fresh checkout, and a full TerminusDB load alone
  # takes 20-25+ minutes — too slow to run on every push. This job is a
  # regression smoke check that the harness still runs end to end against
  # live baselines, not a source of citable numbers; cite §8 instead.
  benchmarks:
    name: baseline benchmarks — smoke regression, see docs/benchmark_report.md §8 for real numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB + protobuf build dependencies
        # run_baseline.sh's caregraph side builds via `cargo run --release`,
        # not a pre-built binary — this job needs the same toolchain as
        # lint/test, which the original benchmarks job never had (it was
        # never actually run before this phase — see the commit history).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake llvm-dev protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline runner Python dependencies
        run: pip install -r benchmarks/requirements.txt
      # --wait blocks until neo4j's healthcheck passes and terminusdb reaches
      # "running" (it has no healthcheck defined) — without this the next step
      # can race container startup, since `up -d` alone returns as soon as the
      # containers are created, not once they're actually serving.
      - run: docker compose -f infrastructure/docker-compose/dev-stack.yml up -d --wait neo4j terminusdb
      - run: |
          # A hardware spec is required for any benchmark number; run_baseline.sh
          # hard-stops without one. GitHub-hosted runner specs vary by run and aren't
          # published precisely, so this is disclosed as what it is rather than a
          # fabricated number — this job is a regression smoke check anyway (see the
          # job name), not a source for docs/benchmark_report.md's citable numbers.
          export CAREGRAPH_HARDWARE="GitHub Actions ubuntu-latest hosted runner (spec varies by run, see https://github.com/actions/runner-images)"
          bash benchmarks/run_baseline.sh \
            --trace benchmarks/traces/diabetes130_smoke_100.jsonl \
            --hops 2 --queries 200
