[package]
name = "caregraph"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A temporally-versioned graph database with incrementally-maintained GNN embeddings"
license = "Apache-2.0"
# Bin targets are declared explicitly below; without this, Cargo would also
# auto-discover src/bin/load_trace.rs and register it a second time.
autobins = false

[[bin]]
name = "caregraph"
path = "src/main.rs"

[[bin]]
name = "caregraph-load"
path = "src/bin/load_trace.rs"

[[bin]]
name = "caregraph-bench-pit"
path = "src/bin/bench_pit.rs"

[[bin]]
name = "caregraph-bench-traversal"
path = "src/bin/bench_traversal.rs"

[[bin]]
name = "caregraph-bench-incremental"
path = "src/bin/bench_incremental.rs"

[[bin]]
name = "caregraph-fault-injection-worker"
path = "src/bin/fault_injection_worker.rs"

[dependencies]
# --- Storage & persistence (PRD 2.1) -----------------------------------------
# NOTE: the PRD specifies "rust-rocksdb 0.43+". `rust-rocksdb` is the name of the
# GitHub repository; the crate it publishes to crates.io is `rocksdb`, whose own
# version line is 0.2x. Pinned to the canonical crate here so the build resolves.
# Confirm against the intended fork at first `cargo build` (see docs/TOOLCHAIN.md).
rocksdb = { version = "0.23", features = ["multi-threaded-cf", "lz4"] }
# Needed directly (not just transitively via `rocksdb`) because `rocksdb::ffi`
# is a private re-export (`use librocksdb_sys as ffi;`, not `pub use`) — the
# encryption shim's extern "C" declaration in src/storage/encryption.rs needs
# to name `rocksdb_env_t` itself. Version/features pinned to match `rocksdb`
# 0.23's own dependency exactly so Cargo unifies both to one compiled crate
# instance rather than building RocksDB's C++ core twice.
librocksdb-sys = { version = "0.17.1", default-features = false, features = ["static"] }

# --- Async runtime (PRD 2.2) -------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }

# --- Serialization -----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Errors & logging --------------------------------------------------------
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Observability (PRD 2.8) -------------------------------------------------
prometheus = "0.14"

# --- Query & API (PRD 2.4) ----------------------------------------------------
# PRD names "tonic 0.11+"; pinned to the 0.12 line, the first that builds
# cleanly against this toolchain's prost/protobuf transitive versions.
# "tls" enables rustls-backed mTLS (ServerTlsConfig/ClientTlsConfig, Phase 7) —
# on both the server (src/main.rs) and, via this same shared dependency, the
# client side the mTLS integration test uses to connect.
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
# --- Real RocksDB encryption at rest (Rule 8) --------------------------------
# The `rocksdb` crate exposes no encryption API at all — its C API
# (librocksdb-sys) never wraps rocksdb/env_encryption.h, even though the C++
# core it statically links already compiles that file in. native/rocksdb_encryption/
# bridges to it directly via a small C++ shim (see that directory's module doc)
# that needs librocksdb-sys's vendored `rocksdb/include/` headers at compile
# time. librocksdb-sys is pulled in transitively via the `rocksdb` dependency
# above already (no direct dependency needed here) — build.rs locates its
# exact resolved path via `cargo_metadata` rather than the `links`-propagated
# DEP_ROCKSDB_* env vars, which turned out not to be visible from this crate's
# build script in practice (verified empirically: printed zero DEP_* vars).
cc = "1"
cargo_metadata = "0.18"

[dev-dependencies]
tempfile = "3"
proptest = "1"
# Real client for the Rule 2 endpoint test — connects to a real tonic server
# over an in-memory transport, not a mocked RPC layer.
tokio-stream = "0.1"
# Generates real, ephemeral CA/server/client certificates in-process for the
# mTLS integration test (Phase 7) — no committed cert files, no dependency on
# an external `openssl` CLI being on PATH in every dev/CI environment.
rcgen = "0.13"

# Cargo only auto-discovers test crates at the top level of tests/. The PRD's
# Section 10 layout puts them in subdirectories, so each suite is declared here.
[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

# Needs a real trained model on disk and a real Python + torch interpreter
# (Rule 3); not run by the default `cargo test` sweep of --lib/--test unit/
# --test integration, same reason the Rule 4 baselines are not in CI yet.
[[test]]
name = "embedding"
path = "tests/embedding/main.rs"

# Spawns and kills the caregraph-fault-injection-worker binary in a loop
# (Rule 5); needs the worker built first and a real trained model on disk,
# same preconditions as `embedding` above — not run by the default sweep.
[[test]]
name = "fault_injection"
path = "tests/fault_injection/main.rs"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
debug = true
