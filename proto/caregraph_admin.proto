// CareGraph administrative service.
//
// Everything here needs the live database handle (a running server holds the
// RocksDB lock, so an offline tool cannot open it), which is why these are RPCs
// rather than only `caregraph-admin` subcommands. Callers need the `admin` role;
// every call is written to the per-pod audit log before it runs.
//
// Offline operations (restore, backup verification, re-encryption, audit
// verification of a stopped database) are `caregraph-admin` subcommands that
// open the files directly.

syntax = "proto3";

package caregraph.admin.v1;

service AdminService {
  // Takes an incremental, encrypted backup of the database into the
  // configured backup directory. One at a time: a second concurrent request is
  // ABORTED rather than queued.
  rpc CreateBackup(CreateBackupRequest) returns (BackupInfo);

  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);

  // Hard-links a consistent point-in-time copy of the database beside the
  // backups. Fast and nearly free in space; used to bootstrap a replica.
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CheckpointInfo);

  // Verifies the mutation audit chain against what is stored now.
  rpc VerifyAudit(VerifyAuditRequest) returns (AuditVerification);

  rpc Status(StatusRequest) returns (StatusResponse);

  // Failover. Demote the old leader first, then promote the standby with the
  // sequence number Demote returned.
  //
  // Demote stops this node accepting writes (permanently: it must be rebuilt
  // from a checkpoint of the new leader before it rejoins), waits for in-flight
  // writes to finish, and keeps streaming until the standby has everything up
  // to `final_sequence`.
  rpc Demote(DemoteRequest) returns (DemoteResponse);

  // Promote makes a follower the leader: it waits until it has applied
  // `wait_for_sequence`, starts a new leadership epoch and begins accepting
  // writes.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
}

message CreateBackupRequest {}

message BackupInfo {
  uint32 backup_id = 1;
  int64 created_unix = 2;
  uint64 size_bytes = 3;
  uint32 num_files = 4;
  // RocksDB sequence number the backup captured: everything committed up to
  // here is in it, nothing after.
  uint64 sequence = 5;
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
}

message CreateCheckpointRequest {
  // [A-Za-z0-9._-], 1..=64 characters. The server decides the directory.
  string name = 1;
}

message CheckpointInfo {
  string name = 1;
  string path = 2;
  uint64 sequence = 3;
}

message VerifyAuditRequest {}

message AuditVerification {
  bool intact = 1;
  uint64 records = 2;
  // Hex hash of the last record in the chain.
  string head = 3;
  // When not intact: the sequence of the first record that does not verify.
  uint64 first_bad_seq = 4;
  string detail = 5;
}

message StatusRequest {}

message StatusResponse {
  uint64 latest_sequence = 1;
  // Commit high-water mark (microseconds).
  uint64 hwm_us = 2;
  uint64 audit_records = 3;
  string audit_head = 4;
  uint32 backups = 5;
  int64 last_backup_unix = 6;
  bool backups_configured = 7;
  // standalone | leader | follower | demoted | fenced
  string role = 8;
  uint64 epoch = 9;
  // Follower: the leader's newest sequence number as last reported.
  uint64 leader_sequence = 10;
  // Follower: sequence numbers behind the leader.
  uint64 lag = 11;
  bool needs_bootstrap = 12;
  bool ready_for_reads = 13;
  // Leader: connected followers and how far each has confirmed.
  repeated FollowerInfo followers = 14;
}

message FollowerInfo {
  string id = 1;
  uint64 acked_sequence = 2;
}

message DemoteRequest {
  // How long to wait for in-flight writes and for a follower to catch up.
  // 0 = 30 seconds.
  uint32 timeout_ms = 1;
}

message DemoteResponse {
  // The last sequence number this node committed. Nothing is written after it.
  uint64 final_sequence = 1;
  uint64 epoch = 2;
  // Whether a follower confirmed everything up to final_sequence in time.
  bool follower_caught_up = 3;
}

message PromoteRequest {
  // Wait until this node has applied at least this sequence (the old leader's
  // final_sequence). 0 = do not wait.
  uint64 wait_for_sequence = 1;
  // 0 = 30 seconds.
  uint32 wait_timeout_ms = 2;
  // Promote even if wait_for_sequence was not reached. Anything the old leader
  // committed beyond what this node has is lost.
  bool force = 3;
}

message PromoteResponse {
  uint64 epoch = 1;
  uint64 sequence = 2;
}
