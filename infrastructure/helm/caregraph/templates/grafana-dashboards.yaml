{{- if .Values.metrics.grafanaDashboards.enabled }}
{{- $full := include "caregraph.fullname" . }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-dashboard-{{ base $path | trimSuffix ".json" | replace "_" "-" }}
  labels:
    {{- include "caregraph.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
---
{{- end }}
{{- end }}
