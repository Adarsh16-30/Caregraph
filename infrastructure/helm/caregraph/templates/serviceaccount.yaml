{{- $full := include "caregraph.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# The role-label sidecar patches the label on the writer pods' own objects, and
# nothing else: no list, no get, no other pods, no other resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-role-label
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
    resourceNames:
      {{- range $i := until (int .Values.writer.replicas) }}
      - {{ $full }}-writer-{{ $i }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-role-label
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-role-label
subjects:
  - kind: ServiceAccount
    name: {{ $full }}
    namespace: {{ .Release.Namespace }}
