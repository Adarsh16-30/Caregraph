{{- if and (not (include "caregraph.isProduction" .)) (not .Values.tls.enabled) (not .Values.auth.existingSecret) .Values.auth.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caregraph.devAuthSecret" . }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.apiKey | quote }}
{{- end }}
