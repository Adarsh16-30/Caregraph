{{- if .Values.externalSecrets.enabled }}
{{- $store := required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
{{- $refs := .Values.externalSecrets.remoteRefs }}
{{- $kind := .Values.externalSecrets.secretStoreRef.kind }}
{{- $every := .Values.externalSecrets.refreshInterval }}
{{- /* One ExternalSecret per Secret the pods mount, filled from the secret manager. */ -}}
{{- if and .Values.tls.secretName $refs.tlsCert }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.tls.secretName }}
  data:
    - {secretKey: tls.crt, remoteRef: {key: {{ $refs.tlsCert | quote }}}}
    - {secretKey: tls.key, remoteRef: {key: {{ required "remoteRefs.tlsKey is required" $refs.tlsKey | quote }}}}
    - {secretKey: ca.crt, remoteRef: {key: {{ required "remoteRefs.clientCa is required" $refs.clientCa | quote }}}}
{{- end }}
{{- if and .Values.tls.adminSecretName $refs.adminCert }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tls.adminSecretName }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.tls.adminSecretName }}
  data:
    - {secretKey: tls.crt, remoteRef: {key: {{ $refs.adminCert | quote }}}}
    - {secretKey: tls.key, remoteRef: {key: {{ required "remoteRefs.adminKey is required" $refs.adminKey | quote }}}}
    - {secretKey: ca.crt, remoteRef: {key: {{ required "remoteRefs.adminCa is required" $refs.adminCa | quote }}}}
{{- end }}
{{- if and .Values.encryption.secretName $refs.kek }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.encryption.secretName }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.encryption.secretName }}
  data:
    - {secretKey: kek, remoteRef: {key: {{ $refs.kek | quote }}}}
    - {secretKey: wrapped-dek, remoteRef: {key: {{ required "remoteRefs.wrappedDek is required" $refs.wrappedDek | quote }}}}
{{- end }}
{{- if and .Values.tokens.secretName $refs.tokens }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tokens.secretName }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.tokens.secretName }}
  data:
    - {secretKey: tokens.toml, remoteRef: {key: {{ $refs.tokens | quote }}}}
{{- end }}
{{- if and .Values.tokens.replicationTokenSecret $refs.replicationToken }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tokens.replicationTokenSecret }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.tokens.replicationTokenSecret }}
  data:
    - {secretKey: token, remoteRef: {key: {{ $refs.replicationToken | quote }}}}
{{- end }}
{{- if and .Values.tokens.adminTokenSecret $refs.adminToken }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tokens.adminTokenSecret }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $every }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $kind }}}
  target:
    name: {{ .Values.tokens.adminTokenSecret }}
  data:
    - {secretKey: token, remoteRef: {key: {{ $refs.adminToken | quote }}}}
{{- end }}
{{- end }}
