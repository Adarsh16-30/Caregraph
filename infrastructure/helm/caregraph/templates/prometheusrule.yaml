{{- if .Values.metrics.prometheusRule.enabled }}
# The alert rules are files/alert-rules.yaml, a copy of
# observability/prometheus/alert-rules.yaml (scripts/sync_chart_files.sh keeps them
# equal and CI checks it).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "caregraph.fullname" . }}
  labels:
    {{- include "caregraph.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- (.Files.Get "files/alert-rules.yaml" | fromYaml).groups | toYaml | nindent 4 }}
{{- end }}
