# CareGraph local development stack (PRD Phase 1).
#
# Brings up the CareGraph service alongside the two baseline systems that Rule 4
# requires benchmarks to run against — real, running Neo4j + GDS and TerminusDB
# instances, never published numbers — plus the Prometheus/Grafana pair that
# Rules 7 and 9 depend on.
#
#   docker compose -f infrastructure/docker-compose/dev-stack.yml up --build
#       just CareGraph (the default)
#   ... --profile observability up      adds Prometheus and Grafana
#   ... --profile baselines up          adds Neo4j and TerminusDB (Rule 4 runs)
#   ... up -d neo4j terminusdb          naming a service starts it without the profile
#
# Only CareGraph runs by default: it does not need the baselines, and the two
# baseline databases plus the observability pair are several gigabytes of memory
# that a development session rarely uses. Each service has a memory ceiling you
# can set in `.env` (CAREGRAPH_CONTAINER_MEM, NEO4J_MEM_LIMIT, ...).
#
# Credentials here are local-development only and come from the environment.
# See infrastructure/docker-compose/.env.example.

name: caregraph-dev

services:
  caregraph:
    build:
      context: ../..
      dockerfile: infrastructure/docker-compose/Dockerfile
    container_name: caregraph
    environment:
      CAREGRAPH_DB_PATH: /var/lib/caregraph/db
      RUST_LOG: ${RUST_LOG:-caregraph=info}
      # The server's own budget for its whole process tree (RocksDB, caches, and
      # Python workers). Keep it below the container ceiling. Empty = unset.
      CAREGRAPH_MEMORY_MB: ${CAREGRAPH_MEMORY_MB:-}
    mem_limit: ${CAREGRAPH_CONTAINER_MEM:-2g}
    volumes:
      - caregraph_data:/var/lib/caregraph
    ports:
      - "50051:50051"   # gRPC query service (wired up in Phase 6)
      - "9100:9100"     # Prometheus scrape endpoint (Phase 7)
    restart: unless-stopped

  # --- Baseline: traversal + GDS embedding comparison (Rule 4) ---------------
  neo4j:
    image: neo4j:5.26-community
    container_name: caregraph-neo4j
    profiles: ["baselines"]
    mem_limit: ${NEO4J_MEM_LIMIT:-4g}
    cpus: ${BASELINE_CPUS:-4}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-caregraph-dev-only}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Bolt readiness, not just process liveness — the benchmark harness
      # connects over Bolt and must not race container startup.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # --- Baseline: versioning comparison (Rule 4) -----------------------------
  terminusdb:
    image: terminusdb/terminusdb-server:v11.1.14
    container_name: caregraph-terminusdb
    profiles: ["baselines"]
    mem_limit: ${TERMINUSDB_MEM_LIMIT:-2g}
    cpus: ${BASELINE_CPUS:-4}
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_PASSWORD:-caregraph-dev-only}
      TERMINUSDB_SERVER_PORT: 6363
    ports:
      - "6363:6363"
    volumes:
      - terminusdb_data:/app/terminusdb/storage

  # --- Observability (Rules 7 and 9) ----------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: caregraph-prometheus
    profiles: ["observability"]
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.14
    container_name: caregraph-grafana
    profiles: ["observability"]
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-caregraph-dev-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  caregraph_data:
  neo4j_data:
  terminusdb_data:
  prometheus_data:
  grafana_data:
