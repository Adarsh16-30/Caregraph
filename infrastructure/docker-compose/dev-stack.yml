# CareGraph local development stack (PRD Phase 1).
#
# Brings up the CareGraph service alongside the two baseline systems that Rule 4
# requires benchmarks to run against — real, running Neo4j + GDS and TerminusDB
# instances, never published numbers — plus the Prometheus/Grafana pair that
# Rules 7 and 9 depend on.
#
#   docker compose -f infrastructure/docker-compose/dev-stack.yml up --build
#
# Credentials here are local-development only and come from the environment.
# See infrastructure/docker-compose/.env.example.

name: caregraph-dev

services:
  caregraph:
    build:
      context: ../..
      dockerfile: infrastructure/docker-compose/Dockerfile
    container_name: caregraph
    environment:
      CAREGRAPH_DB_PATH: /var/lib/caregraph/db
      RUST_LOG: ${RUST_LOG:-caregraph=info}
    volumes:
      - caregraph_data:/var/lib/caregraph
    ports:
      - "50051:50051"   # gRPC query service (wired up in Phase 6)
      - "9100:9100"     # Prometheus scrape endpoint (Phase 7)
    depends_on:
      neo4j:
        condition: service_healthy
      terminusdb:
        condition: service_started
    restart: unless-stopped

  # --- Baseline: traversal + GDS embedding comparison (Rule 4) ---------------
  neo4j:
    image: neo4j:5.26-community
    container_name: caregraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-caregraph-dev-only}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Bolt readiness, not just process liveness — the benchmark harness
      # connects over Bolt and must not race container startup.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # --- Baseline: versioning comparison (Rule 4) -----------------------------
  terminusdb:
    image: terminusdb/terminusdb-server:v11.1.14
    container_name: caregraph-terminusdb
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_PASSWORD:-caregraph-dev-only}
      TERMINUSDB_SERVER_PORT: 6363
    ports:
      - "6363:6363"
    volumes:
      - terminusdb_data:/app/terminusdb/storage

  # --- Observability (Rules 7 and 9) ----------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: caregraph-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.14
    container_name: caregraph-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-caregraph-dev-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  caregraph_data:
  neo4j_data:
  terminusdb_data:
  prometheus_data:
  grafana_data:
