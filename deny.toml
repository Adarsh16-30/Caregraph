# cargo-deny policy: advisories, licenses, duplicate/banned crates.
[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is archived, not vulnerable: it is a thin wrapper over the PEM parsing now in rustls-pki-types. We use it directly (security/tls.rs, kube_label.rs) and tonic 0.12 pulls it in, so only a tonic upgrade clears it. It parses operator-supplied certificate files at start-up and on reload, never request data. Revisit when moving to a newer tonic." },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Two tonic versions in one binary means two gRPC stacks; keep exactly one.
deny = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
